<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F45 — Календарь тренировок 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --font-body:'Inter','Helvetica Neue',Arial,sans-serif;
  --text-xs:clamp(.7rem,.65rem + .25vw,.8rem);
  --text-sm:clamp(.8rem,.75rem + .25vw,.9rem);
  --text-base:clamp(.9rem,.85rem + .25vw,1rem);
  --text-lg:clamp(1.1rem,1rem + .5vw,1.35rem);
  --text-xl:clamp(1.4rem,1.1rem + 1vw,2rem);
  --text-2xl:clamp(1.8rem,1.2rem + 2vw,2.8rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;
  --transition:180ms cubic-bezier(.16,1,.3,1);
  --f45-red:#D6001C;--f45-red-hover:#BB051D;
  --f45-navy:#211551;--f45-navy-light:#4531A6;
}

[data-theme="dark"]{
  --color-bg:#0d0a1a;--color-surface:#161230;--color-surface-2:#1c1640;
  --color-surface-elevated:#241d4a;--color-border:#2a2255;--color-border-hover:#3d3370;
  --color-text:#eceaf5;--color-text-muted:#9490b0;--color-text-faint:#605c80;
  --color-accent:var(--f45-red);--color-accent-hover:var(--f45-red-hover);
  --color-cardio:#ff8c42;--color-resistance:#7c6bff;--color-hybrid:#2dd4a8;
  --shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 12px 40px rgba(0,0,0,.6);
}

[data-theme="light"]{
  --color-bg:#f5f4f8;--color-surface:#fff;--color-surface-2:#f9f8fc;
  --color-surface-elevated:#fff;--color-border:#e2dff0;--color-border-hover:#d0cbea;
  --color-text:#1a1535;--color-text-muted:#6b6590;--color-text-faint:#a5a0be;
  --color-accent:#c2001a;--color-accent-hover:#a00016;
  --color-cardio:#d96a20;--color-resistance:#5a4dc7;--color-hybrid:#0f9d7a;
  --shadow-md:0 4px 16px rgba(33,21,81,.08);--shadow-lg:0 12px 40px rgba(33,21,81,.12);
}

html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:0 var(--space-6)}

/* HEADER */
.header{padding:var(--space-8) 0 var(--space-5);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-5)}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)}
.logo-area{display:flex;align-items:center;gap:var(--space-4)}
.logo-mark{width:52px;height:52px;background:var(--f45-red);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#fff;flex-shrink:0}
.logo-text h1{font-size:var(--text-xl);font-weight:800;line-height:1.15;letter-spacing:-.03em}
.logo-text .subtitle{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:500;margin-top:2px}
.theme-toggle{cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-full);width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);transition:all var(--transition);flex-shrink:0}
.theme-toggle:hover{border-color:var(--color-border-hover);color:var(--color-text)}

/* SERIES TABS */
.series-tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-4)}
.series-tab-btn{cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:var(--space-2) var(--space-5);font-size:var(--text-sm);font-weight:700;color:var(--color-text-muted);transition:all var(--transition)}
.series-tab-btn:hover{border-color:var(--color-border-hover);color:var(--color-text)}
.series-tab-btn.active{background:var(--f45-red);border-color:var(--f45-red);color:#fff}

/* SERIES BANNER */
.series-banner{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-5) var(--space-6);margin-bottom:var(--space-5);position:relative;overflow:hidden}
.series-banner::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--f45-red)}
.series-name{font-size:var(--text-lg);font-weight:800;margin-bottom:var(--space-1);letter-spacing:-.02em}
.series-desc{font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.6;max-width:80ch}
.series-meta{display:flex;gap:var(--space-6);margin-top:var(--space-3);flex-wrap:wrap}
.series-meta-item{font-size:var(--text-xs);color:var(--color-text-faint);font-weight:500}
.series-meta-item strong{color:var(--color-text);font-weight:700}

/* PHASE TABS */
.phase-tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-5);flex-wrap:wrap}
.phase-tab{cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-5);font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);transition:all var(--transition);display:flex;flex-direction:column;gap:2px;min-width:140px}
.phase-tab:hover{border-color:var(--color-border-hover);color:var(--color-text)}
.phase-tab.active{background:var(--f45-navy);border-color:var(--f45-navy);color:#fff}
.phase-tab .tab-label{font-size:var(--text-xs);opacity:.7;font-weight:500}
.phase-tab .tab-name{font-weight:700}
.phase-tab.active .tab-label{opacity:.8}
.phase-tab.future{opacity:.5;border-style:dashed}

/* PHASE INFO */
.phase-info{display:flex;align-items:center;gap:var(--space-6);margin-bottom:var(--space-5);flex-wrap:wrap}
.date-chip{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--color-text-muted)}
.date-chip svg{width:16px;height:16px;flex-shrink:0}
.date-chip strong{color:var(--color-text);font-weight:600}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-bottom:var(--space-5)}
.stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);text-align:center}
.stat-card .stat-value{font-size:var(--text-xl);font-weight:800;line-height:1.2}
.stat-card .stat-value.cardio{color:var(--color-cardio)}
.stat-card .stat-value.resistance{color:var(--color-resistance)}
.stat-card .stat-value.hybrid{color:var(--color-hybrid)}
.stat-card .stat-label{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* FILTERS */
.filters{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-5);flex-wrap:wrap}
.filter-btn{cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-full);padding:var(--space-2) var(--space-5);font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);transition:all var(--transition);white-space:nowrap}
.filter-btn:hover{border-color:var(--color-border-hover);color:var(--color-text)}
.filter-btn.active{background:var(--color-text);color:var(--color-bg);border-color:var(--color-text)}
.filter-btn.active[data-filter="cardio"]{background:var(--color-cardio);border-color:var(--color-cardio);color:#fff}
.filter-btn.active[data-filter="resistance"]{background:var(--color-resistance);border-color:var(--color-resistance);color:#fff}
.filter-btn.active[data-filter="hybrid"]{background:var(--color-hybrid);border-color:var(--color-hybrid);color:#fff}

/* WEEK NAV */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)}
.week-title{font-size:var(--text-lg);font-weight:700}
.week-nav-btns{display:flex;gap:var(--space-2)}
.nav-btn{cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);transition:all var(--transition)}
.nav-btn:hover{border-color:var(--color-border-hover);color:var(--color-text)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}

/* CALENDAR */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-3);margin-bottom:var(--space-8)}
.day-header{text-align:center;font-size:var(--text-xs);font-weight:700;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.08em;padding-bottom:var(--space-2)}
.day-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:all var(--transition);min-height:140px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.day-card[data-type="cardio"]::before{background:var(--color-cardio)}
.day-card[data-type="resistance"]::before{background:var(--color-resistance)}
.day-card[data-type="hybrid"]::before{background:var(--color-hybrid)}
.day-card:hover{border-color:var(--color-border-hover);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.day-card.today{border-color:var(--f45-red);box-shadow:0 0 0 1px var(--f45-red)}
.day-card.hidden{opacity:.12;pointer-events:none;transform:scale(.97)}
.day-card .day-date{font-size:var(--text-xs);color:var(--color-text-faint);font-weight:500;margin-bottom:var(--space-1)}
.day-card .day-name{font-size:var(--text-base);font-weight:700;margin-bottom:var(--space-1);line-height:1.3}
.day-card .day-timing{font-size:.7rem;color:var(--color-text-muted);margin-bottom:var(--space-2);line-height:1.4}
.day-card .day-type{display:inline-flex;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:auto;padding:3px 10px;border-radius:var(--radius-full)}
.day-card[data-type="cardio"] .day-type{color:var(--color-cardio);background:rgba(255,140,66,.12)}
.day-card[data-type="resistance"] .day-type{color:var(--color-resistance);background:rgba(124,107,255,.12)}
.day-card[data-type="hybrid"] .day-type{color:var(--color-hybrid);background:rgba(45,212,168,.12)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(13,10,26,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--space-6);opacity:0;pointer-events:none;transition:opacity 200ms ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.97);transition:transform 200ms ease}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-header{position:relative;padding:var(--space-6) var(--space-6) var(--space-4)}
.modal-header::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.modal[data-type="cardio"] .modal-header::before{background:var(--color-cardio)}
.modal[data-type="resistance"] .modal-header::before{background:var(--color-resistance)}
.modal[data-type="hybrid"] .modal-header::before{background:var(--color-hybrid)}
.modal-close{position:absolute;top:var(--space-4);right:var(--space-4);cursor:pointer;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-full);width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);transition:all var(--transition)}
.modal-close:hover{color:var(--color-text);border-color:var(--color-border-hover)}
.modal-date{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:500;margin-bottom:var(--space-1)}
.modal-title{font-size:var(--text-xl);font-weight:800;line-height:1.15;letter-spacing:-.02em}
.modal-type-badge{display:inline-flex;font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px var(--space-3);border-radius:var(--radius-full);margin-top:var(--space-3)}
.modal[data-type="cardio"] .modal-type-badge{color:var(--color-cardio);background:rgba(255,140,66,.12)}
.modal[data-type="resistance"] .modal-type-badge{color:var(--color-resistance);background:rgba(124,107,255,.12)}
.modal[data-type="hybrid"] .modal-type-badge{color:var(--color-hybrid);background:rgba(45,212,168,.12)}
.modal-body{padding:0 var(--space-6) var(--space-6)}
.modal-desc{font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.7;margin-bottom:var(--space-5)}
.timing-section{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-5)}
.timing-title{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-faint);margin-bottom:var(--space-3)}
.timing-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) 0;border-bottom:1px solid var(--color-border);font-size:var(--text-sm)}
.timing-row:last-child{border-bottom:none}
.timing-row .label{color:var(--color-text-muted);font-weight:500}
.timing-row .value{color:var(--color-text);font-weight:700;font-variant-numeric:tabular-nums}
.modal-details{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.detail-item{background:var(--color-surface-2);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}
.detail-item .detail-label{font-size:.65rem;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:2px}
.detail-item .detail-value{font-size:var(--text-sm);font-weight:700;color:var(--color-text)}

.footer{border-top:1px solid var(--color-border);padding:var(--space-5) 0;text-align:center;font-size:var(--text-xs);color:var(--color-text-faint)}

@media(max-width:768px){
  .calendar-grid{grid-template-columns:1fr;gap:var(--space-2)}
  .day-header{display:none}
  .day-card{min-height:auto;flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
  .day-card::before{width:3px;height:100%;border-radius:var(--radius-lg) 0 0 var(--radius-lg);right:auto;bottom:0}
  .day-card .day-date{min-width:48px;margin-bottom:0;font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted)}
  .day-card .day-name{margin-bottom:0;flex:1}
  .day-card .day-timing{display:none}
  .day-card .day-type{margin-top:0}
  .stats-row{gap:var(--space-2)}
  .stat-card{padding:var(--space-3)}
  .phase-tab{min-width:auto;padding:var(--space-2) var(--space-4)}
}

@media(max-width:480px){
  .container{padding:0 var(--space-4)}
  .filter-btn{padding:var(--space-2) var(--space-3);font-size:var(--text-xs)}
}

@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#0d0a1a;--color-surface:#161230;--color-surface-2:#1c1640;
  --color-surface-elevated:#241d4a;--color-border:#2a2255;--color-border-hover:#3d3370;
  --color-text:#eceaf5;--color-text-muted:#9490b0;--color-text-faint:#605c80;
  --color-accent:#D6001C;--color-accent-hover:#BB051D;
  --color-cardio:#ff8c42;--color-resistance:#7c6bff;--color-hybrid:#2dd4a8;
  --shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 12px 40px rgba(0,0,0,.6)
}}

/* CATALOG SECTION */
.catalog-section { margin-top: var(--space-4); }
.catalog-section-title { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-faint); margin-bottom: var(--space-3); }
.floor-plan { border-radius: var(--radius-md); margin-bottom: var(--space-4); overflow: hidden; }
.floor-plan img { width: 100%; height: auto; display: block; border-radius: var(--radius-md); }
.workout-stats-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-bottom: var(--space-4); }
.stat-mini { background: var(--color-surface-2); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); text-align: center; }
.stat-mini .sm-label { font-size: .6rem; color: var(--color-text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.stat-mini .sm-value { font-size: var(--text-xs); font-weight: 700; color: var(--color-text); margin-top: 2px; }
.catalog-notes-list { margin: 0; padding-left: var(--space-5); font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.7; }
.catalog-notes-list li { margin-bottom: var(--space-2); }
.catalog-desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: 1.7; margin-bottom: var(--space-4); font-style: italic; border-left: 3px solid var(--color-border); padding-left: var(--space-4); }

/* ===== AUTH SCREEN ===== */
#auth-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:var(--color-bg,#0d0d0f);
  padding:var(--space-4);
}
#auth-screen.hidden{display:none;}
.auth-card{
  background:var(--color-surface,#18181b);
  border:1px solid var(--color-border,rgba(255,255,255,.08));
  border-radius:var(--radius-xl);
  padding:var(--space-8) var(--space-8);
  width:100%;max-width:380px;
  display:flex;flex-direction:column;gap:var(--space-5);
}
.auth-logo{
  display:flex;align-items:center;gap:var(--space-3);
  font-size:var(--text-xl);font-weight:800;letter-spacing:-.02em;
  color:var(--color-text,#fafafa);
}
.auth-logo .auth-badge{
  background:var(--f45-red);color:#fff;
  font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;
  padding:2px 8px;border-radius:var(--radius-sm);
  text-transform:uppercase;
}
.auth-title{
  font-size:var(--text-base);font-weight:600;
  color:var(--color-text-faint,rgba(255,255,255,.5));
  margin-top:calc(-1 * var(--space-2));
}
.auth-field{display:flex;flex-direction:column;gap:var(--space-2);}
.auth-field label{
  font-size:var(--text-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--color-text-faint,rgba(255,255,255,.5));
}
.auth-field input{
  background:var(--color-surface-2,rgba(255,255,255,.05));
  border:1px solid var(--color-border,rgba(255,255,255,.08));
  border-radius:var(--radius-md);
  padding:var(--space-3) var(--space-4);
  font-size:var(--text-sm);color:var(--color-text,#fafafa);
  font-family:var(--font-body);
  outline:none;transition:border-color var(--transition);width:100%;
}
.auth-field input:focus{border-color:var(--f45-red);}
.auth-btn{
  background:var(--f45-red);color:#fff;border:none;
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  font-size:var(--text-sm);font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;transition:background var(--transition);width:100%;
  font-family:var(--font-body);
}
.auth-btn:hover{background:var(--f45-red-hover);}
.auth-btn:disabled{opacity:.5;cursor:not-allowed;}
.auth-error{
  font-size:var(--text-xs);color:#f87171;text-align:center;
  min-height:1.2em;
}
.auth-spinner{
  display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;
  vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-badge">F45</span>
      Календарь тренировок
    </div>
    <div class="auth-title">Портал для тренеров</div>
    <div class="auth-field">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="auth-password">Пароль</label>
      <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="auth-btn" id="auth-btn" onclick="doLogin()">
      Войти
    </button>
  </div>
</div>


<div class="container">

const AUTH_KEY = 'f45_auth_v1';

function checkAuth() {
  const saved = sessionStorage.getItem(AUTH_KEY);
  if (saved) {
    try {
      const d = JSON.parse(saved);
      if (d.expires > Date.now()) {
        document.getElementById('auth-screen').classList.add('hidden');
        return true;
      }
    } catch(e) {}
  }
  sessionStorage.removeItem(AUTH_KEY);
  return false;
}

function doLogin() {
  const emailRaw = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl    = document.getElementById('auth-error');
  const btn      = document.getElementById('auth-btn');

  errEl.textContent = '';
  if (!emailRaw || !password) {
    errEl.textContent = 'Введите email и пароль';
    return;
  }

  const email = emailRaw.toLowerCase();
  const user = AUTH_USERS.find(u => u.email === email && u.password === password);

  if (user) {
    // Сессия 24 часа
    sessionStorage.setItem(AUTH_KEY, JSON.stringify({
      email: user.email,
      name:  user.name,
      expires: Date.now() + 24 * 60 * 60 * 1000
    }));
    document.getElementById('auth-screen').classList.add('hidden');
  } else {
    errEl.textContent = 'Неверный email или пароль';
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-password').focus();
  }
}

// Enter → логин
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !document.getElementById('auth-screen').classList.contains('hidden')) {

});

  'Desert Heat':{type:'hybrid',typeRu:'Гибрид',description:'Гибридная тренировка с чередованием кардио и силовых станций. 9 кардио + 9 силовых по racetrack, 40/20 · 2 сета · 2 круга.',shortTiming:'40с/20с · 2 сета · 2 круга · Racetrack',timing:[{label:'Тип',value:'Hybrid (Cardio + Resistance, чередование)'},{label:'Работа',value:'40с'},{label:'Отдых',value:'20с'},{label:'Сеты',value:'2'},{label:'Круги',value:'2'},{label:'Станции',value:'18 (9 кардио + 9 силовых)'},{label:'Перемещение',value:'Racetrack'}],focus:'Кардио + Сила · Эрги · Высокий темп',intensity:'Высокая',calories:'500–700',members:'27 (1–2 на станции)',stations:'18 (9C + 9R)',movement:'Racetrack',subtype:'Hybrid C/R alternating',floorPlanType:'racetrack',podCount:1,bgColor:'#c25a00',logoText:'DESERT HEAT',catalogDesc:'Desert Heat — гибридная тренировка с чередованием кардио и силовых станций по всему залу. Ski erg, Row erg, Bike erg как высокоинтенсивные якори в сочетании с тяжёлыми силовыми движениями.',catalogNotes:['Объясните формат перед классом: «Кардио-станция → силовая станция, чередуются по всему racetrack».','Ski erg и Row erg — максимальный выход: полное разгибание тела, сила бёдер, а не рук.','Plate snatch: мощь из ног и бёдер, руки только направляют — взрывное тройное разгибание перед подъёмом.','Barbell sumo deadlift (R-ст.9): выбор стойки. Шарнир бедра — штанга вплотную к телу, нейтральный позвоночник.','2 круга = большой объём. Подскажите участникам какие станции требуют максимума (эрги, берпи) а какие контроля (RDL, shoulder press).']},
  'Track Stars':{type:'hybrid',typeRu:'Гибрид',description:'Партнёрская 60-минутная YGIG тренировка. Сила, bodyweight, функционал, ловкость, плиометрика — партнёры чередуются каждые 15 секунд.',shortTiming:'Lap 1: 90/10 · Lap 2: 60/10 · YGIG · 60 мин',timing:[{label:'Тип',value:'Hybrid · You go, I go · 60 мин'},{label:'Круг 1',value:'90с работа / 10с переход'},{label:'Круг 2',value:'60с работа / 10с переход'},{label:'Формат',value:'YGIG — партнёры чередуются'},{label:'Станции',value:'18'},{label:'Перемещение',value:'Follow the Leader (весь зал)'}],focus:'Сила + Кардио + Ловкость · 60 мин · Партнёр',intensity:'Высокая',calories:'550–750',members:'36 (2 на станции)',stations:'18',movement:'Follow the Leader',subtype:'You go, I go · 60-minutes',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#003322',logoText:'TRACK',catalogDesc:'Объединитесь с партнёром для Track Stars — нового формата F45! 60 минут силовых, bodyweight, функциональных, ловкостных и плиометрических движений в You Go I Go формате.',catalogNotes:['Обязательный брифинг YGIG: «Когда звучит сигнал — Партнёр A начинает. Партнёр B ждёт, болеет, держит активный отдых. После интервала — меняетесь».','Круг 1 (90с) — длинный. Первые 30с — контроль. Средние 30с — рабочий темп. Последние 30с — push.','Подбирайте пары по схожему уровню подготовки, особенно для erg-станций.','Ст. 8 (bicycle crunch / hollow body hold): пока один крутит велосипед — второй держит hollow body. Кью: поясница к полу, ноги 45°, подбородок внутрь.','Ст. 18 (shuttle sprint): определите дистанцию до класса. Торможение в повороте — короткие дробные шаги, не дрейф.','Круг 2 короче (60с) — но интенсивнее на единицу времени. «Вы знаете станции — на Круг 2 давите сильнее».']},
  'Medusa':{type:'resistance',typeRu:'Силовая',description:'Силовая TUT тренировка с прогрессирующим отдыхом и активационным первым сетом. 9 станций, 3 сета: Сет 1 — мобилизация, Сеты 2–3 — тяжёлая нагрузка.',shortTiming:'60с / 15с→20с→30с · 3 сета · 1 круг',timing:[{label:'Тип',value:'Resistance · Time Under Tension'},{label:'Сет 1 (активация)',value:'60с работа / 15с отдых'},{label:'Сет 2 (рабочий)',value:'60с работа / 20с отдых'},{label:'Сет 3 (пик)',value:'60с работа / 30с отдых'},{label:'Станции',value:'9'},{label:'Круги',value:'1'},{label:'Перемещение',value:'Single Pod Racetrack'}],focus:'TUT · Прогрессивная нагрузка · Всё тело',intensity:'Средне-высокая',calories:'380–500',members:'~27 (1–2 на станции)',stations:'9',movement:'Single Pod Racetrack',subtype:'Time Under Tension',floorPlanType:'racetrack',podCount:1,bgColor:'#2a1a3d',logoText:'MEDUSA',catalogDesc:'Medusa — силовая TUT тренировка с уникальной структурой: Сет 1 активирует суставы и мышцы, Сеты 2–3 — тяжёлые рабочие подходы с контролируемым темпом. Отдых растёт от сета к сету для поддержки увеличения нагрузки.',catalogNotes:['Сет 1 — НЕ лёгкий разогрев, а целенаправленная активация. Двигайтесь осознанно через полный диапазон.','TUT темп для Сетов 2–3: «3 секунды вниз, пауза внизу, взрыв вверх». При 60с = 8–15 качественных повторений.','Прогрессируйте вес от сета к сету: Сет 1 — умеренно, Сет 3 — максимальный рабочий вес. 30с отдыха — это больше чем кажется.','Barbell push press (ст.8): дип-драйв — небольшое сгибание колен, взрывное разгибание бёдер, штанга вверх. Не строгий жим — ноги инициируют движение.','Single KB racked box step-up (ст.4): держите гирю в rack-позиции со стороны рабочей ноги. Толчок через пятку, полное разгибание бедра наверху.','Тяжёлые штанговые станции (curl, push press, RDL) расставьте с интервалами для безопасной смены веса между сетами.']},

  'Gemini':{type:'resistance',typeRu:'Силовая',description:'Двойная силовая тренировка с суперсетами. Два упражнения на выбор на каждой станции для максимальной нагрузки.',shortTiming:'35с/25с · 2 сета · 2 круга',timing:[{label:'Работа',value:'35с'},{label:'Отдых',value:'25с'},{label:'Перемещение',value:'Racetrack'}],focus:'Всё тело · Суперсеты',intensity:'Средне-высокая',calories:'380–520',members:'27',stations:'9',movement:'Racetrack',floorPlanType:'racetrack',podCount:1,bgColor:'#1a1a2e',logoText:'GEMINI'},

  '22':{type:'hybrid',typeRu:'Гибрид',description:'Парная суперсет гибридная тренировка с акцентом на выносливость и силу кора. 9 комбо-станций — интенсивность через командную работу и эрг-машины.',shortTiming:'45с/15с · 2 Combo Sets · 1 круг',timing:[{label:'Тип',value:'Hybrid · Combo set'},{label:'Работа',value:'45с'},{label:'Отдых',value:'15с'},{label:'Сеты',value:'2 Combo Sets (A→B)'},{label:'Круги',value:'1'},{label:'Станции',value:'18 (9 комбо)'},{label:'Перемещение',value:'Поды (3)'}],focus:'Выносливость + Кор · Суперсет',intensity:'Высокая',calories:'500–700',members:'36 (2 на станции)',stations:'18 (9 комбо)',movement:'Поды (3)',subtype:'Combo set',floorPlanType:'pods',podCount:3,bgColor:'#6a0dad',logoText:'22',catalogDesc:'22 (два-два) — парная суперсет кардио-тренировка процветающая на интенсивности. Акцент на выносливость и силу кора через эрг-машины, взрывные и функциональные движения.',catalogNotes:['Combo Set: упражнение A (45с/15с) → сразу упражнение B (45с/15с) = 1 комбо-сет.','Заранее настройте обе стороны каждой комбо-станции — 15 сек на переход очень мало.','Bike erg, Ski erg, Row erg, shuttle sprint — максимальный выход на этих станциях.','Ст. 4A (power band vertical jump): объясните что резина помогает взлёту — взрывное разгибание бёдер при отрыве.','Speed sprawls (9B): быстрое падение грудью вниз и взрывной подъём — качество важнее скорости.']},
  'Titans':{type:'resistance',typeRu:'Силовая',description:'Силовая тренировка с тяжёлыми составными движениями. Максимальный вес, минимальные повторения — чистая сила.',shortTiming:'40с/20с · 2 сета · 2 круга',timing:[{label:'Работа',value:'40с'},{label:'Отдых',value:'20с'},{label:'Перемещение',value:'Поды (3)'}],focus:'Максимальная сила · Составные движения',intensity:'Высокая',calories:'350–480',members:'27',stations:'9',movement:'Поды (3)',floorPlanType:'pods',podCount:3,bgColor:'#0d2137',logoText:'TITANS'},

  // === Series 3 Phase 8 (Build) — Reddit r/f45 "Next phase (7?)" 26 июня 2026 ===
  'Threshold':{type:'hybrid',typeRu:'Гибрид / Силовая',description:'Threshold — гибридная силовая тренировка на мышечную выносливость. 10 станций в формате Racetrack, длинные рабочие сеты по 3 минуты (180 сек) с 45 сек отдыха. Функциональные силовые упражнения для развития силы и выносливости за всю сессию.',shortTiming:'180с/45с · 1 сет · 1 круг · Racetrack',timing:[{label:'Тип',value:'Hybrid / Resistance'},{label:'Работа',value:'180 сек (3 минуты)'},{label:'Отдых',value:'45 сек'},{label:'Сеты',value:'1'},{label:'Круги',value:'1'},{label:'Станции',value:'10'},{label:'Перемещение',value:'Racetrack (1 под)'}],focus:'Силовая выносливость · Длинные сеты · Функциональная сила',intensity:'Высокая',calories:'420–560',members:'30 (3 на станции)',stations:'10',movement:'Racetrack',subtype:'Hybrid Resistance',floorPlanType:'racetrack',podCount:1,bgColor:'#1a1a3d',logoText:'THRESHOLD',catalogDesc:'Threshold — гибридная силовая тренировка, построенная вокруг длинных рабочих сетов, контролируемой интенсивности и мышечной выносливости. Сложный микс функциональных силовых упражнений для развития силы и выносливости на протяжении всей сессии.',catalogNotes:['3 минуты на станции — это много. Объясни участникам стратегию: первые 60 сек — умеренный темп, следующие 60 сек — рабочий, последние 60 сек — максимальное усилие.','Подбор веса критически важен. Если участник «сломался» в первую минуту — вес слишком тяжёлый. Помогай с подбором ДО старта.','45 секунд отдыха — переход к следующей станции. Участники должны двигаться немедленно по сигналу, без задержек.','Длинные сеты вызывают накопленную усталость. Следи за ухудшением техники после 2-й минуты — корректируй или предлагай снизить вес.','Racetrack: все движутся в одном направлении. Укажи маршрут ДО старта — новичкам легко потеряться на 10 станциях.']},
  'Varsity':{type:'cardio',typeRu:'Кардио',description:'Varsity — эталонный кардио-тест F45 с нарастающим таймингом. Три круга с разной длительностью интервалов: от спринтов 20/10 до работы на выносливость 60/30. Каждый круг — новое испытание аэробного порога.',shortTiming:'К1: 3×20/10 · К2: 40/20 · К3: 60/30 · 9 станций',timing:[{label:'Тип',value:'Cardio · Escalating Laps'},{label:'Круг 1',value:'3 сета × 20с работа / 10с отдых'},{label:'Круг 2',value:'1 сет × 40с работа / 20с отдых'},{label:'Круг 3',value:'1 сет × 60с работа / 30с отдых'},{label:'Станции',value:'9'},{label:'Поды',value:'1 (весь зал)'}],focus:'Аэробный порог · Нарастающая нагрузка · Кардио-выносливость',intensity:'Очень высокая',calories:'600–800',members:'27 (3 на станции)',stations:'9',movement:'Racetrack',subtype:'Escalating Laps',floorPlanType:'racetrack',podCount:1,bgColor:'#cc0000',logoText:'VARSITY',catalogDesc:'Varsity — эталонная кардио-тренировка F45, объединяющая несколько временны́х доменов в одном занятии. Три круга с прогрессивно нарастающей длительностью интервалов проверяют аэробный порог на разных уровнях интенсивности.',catalogNotes:['Объясни три круга ДО старта: «Первый — самый быстрый (20/10 — Tabata). Второй — умеренный (40/20). Третий — тяжёлый и долгий (60/30). Планируй силы соответственно.»','На 20/10 важна взрывная мощь. Не позволяй участникам «экономить» — 20 секунд максимально, 10 секунд полное восстановление.','На 60/30: это уже не спринт. Устойчивый аэробный темп, техника важнее скорости. Следи за ухудшением формы к концу 60 секунд.','Предупреди о смене тайминга за 10 секунд до начала нового круга — «Следующий круг — 40 секунд, другой темп!»','На battle ropes и ски-эрге: полное разгибание тела на каждом движении. Именно это создаёт большой кардио-стимул, а не частота.']},
  '9s':{type:'resistance',typeRu:'Силовая',description:'9s — силовая тренировка на 9 комбо-станциях. На каждой станции два упражнения по 9 повторений подряд без отдыха. Цель: успеть выполнить 9+9 повторений за 45 секунд с максимальным весом.',shortTiming:'45с/15с · 45с/20с · 2 сета · 2 круга',timing:[{label:'Тип',value:'Resistance · Combo-set'},{label:'Сет 1',value:'45с работа / 15с отдых'},{label:'Сет 2',value:'45с работа / 20с отдых'},{label:'Круги',value:'2'},{label:'Станции',value:'9 комбо'},{label:'Перемещение',value:'Racetrack (1 под)'}],focus:'Силовая выносливость · Комбо-нагрузка · 9 повторений',intensity:'Высокая',calories:'400–550',members:'27 (3 на станции)',stations:'9 комбо',movement:'Racetrack',subtype:'Combo-set',floorPlanType:'racetrack',podCount:1,bgColor:'#003366',logoText:'9S',catalogDesc:'9s (The Nines) — силовая тренировка с уникальным комбо-форматом. На каждой станции два упражнения по 9 повторений без паузы между ними: основное + вспомогательное. 45-секундный рабочий интервал требует подбора серьёзного веса — если остаётся время, значит вес слишком лёгкий.',catalogNotes:['Комбо-станция = 9 повторов упражнения А сразу + 9 повторов упражнения Б без паузы. Покажи демо ДО старта.','Подбор веса — ключ к 9s. Спрашивай участников: «Ты закончил за 30 секунд? Добавь вес в следующем сете.» Цель: последние 1–2 повторения — сложно.','Сет 1 (45/15): быстрее переходим. Сет 2 (45/20): чуть больше восстановления — используй для коррекции веса на следующей станции.','Если участник не успевает выполнить все 18 повторений за 45 секунд — это нормально. Объясни: цель — тяжёлые веса, а не скорость. Лучше сделать 16 с правильным весом, чем 18 с лёгким.']},
  'Heroes Hollywood':{type:'hybrid',typeRu:'Гибрид',description:'Heroes Hollywood — 60-минутная гибридная тренировка, партнёрская версия классического Hollywood. 27 станций в Follow the Leader формате — кардио, сила, ловкость и командный кик.',shortTiming:'40с/15с · 2 круга · 60 мин · Follow the Leader',timing:[{label:'Тип',value:'Hybrid · 60-minutes · Partner'},{label:'Работа',value:'40с'},{label:'Отдых',value:'15с'},{label:'Сеты',value:'1'},{label:'Круги',value:'2 (иногда 3)'},{label:'Станции',value:'27'},{label:'Гидратация',value:'60с между кругами'},{label:'Перемещение',value:'Follow the Leader'}],focus:'Кардио + Сила + Ловкость · 60 мин · Партнёр',intensity:'Высокая',calories:'600–800',members:'36 (2 на станции)',stations:'27',movement:'Follow the Leader',subtype:'60-minutes',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#1a3a1a',logoText:'HEROES HOLLYWOOD',catalogDesc:'Heroes Hollywood — изнурительная 60-минутная версия Hollywood с партнёрским финишером. Все участники движутся вместе по принципу Follow the Leader через 27 станций, 2 круга. Партнёрский аспект создаёт дополнительную ответственность и мотивацию.',catalogNotes:['27 станций — участникам нужна ориентация ДО старта. Потрать 2 минуты: покажи зоны кардио, силы и ловкости. Нарисуй маршрут.','Follow the Leader: ВСЕ двигаются одновременно по сигналу. Убедись, что все знают, куда идти дальше до начала.','15 секунд отдыха — очень мало. Напоминай участникам: «Упражнения специально выбраны умеренными по интенсивности, чтобы 15 секунд было достаточно.»','Партнёрский кик: у каждой пары своя станция. Если один закончил раньше — поддерживает партнёра активным отдыхом или подбадривает.','Второй круг: предупреди за 10 секунд до старта. Участники уже знают упражнения — акцентируй на повышении темпа и вовлечённости.']},
  'All Star':{type:'resistance',typeRu:'Силовая',description:'All Star — воскресная силовая с глобально стандартизированной программой. Все студии F45 по всему миру выполняют одинаковые упражнения. 4 пода по 3 станции, 3 круга в каждом, тайминг 40/20.',shortTiming:'40с/20с · 3 круга · 4 пода · 12 станций',timing:[{label:'Тип',value:'Resistance · Tri-set · Global'},{label:'Работа',value:'40с'},{label:'Отдых',value:'20с'},{label:'Сеты',value:'1'},{label:'Круги на под',value:'3'},{label:'Поды',value:'4 (по 3 станции)'},{label:'Станции',value:'12'},{label:'Гидратация',value:'45с после каждого пода'}],focus:'Всё тело · Глобальная программа · Сила + Техника',intensity:'Высокая',calories:'400–550',members:'36 (3 на станции)',stations:'12',movement:'Поды (4)',subtype:'Tri-set',floorPlanType:'pods',podCount:4,bgColor:'#1a1a4a',logoText:'ALL STAR',catalogDesc:'All Star — особенная воскресная силовая тренировка: упражнения идентичны во всех студиях F45 по всему миру и меняются глобально каждую неделю. Четыре пода противоположных групп мышц, 3 круга в каждом поде при таймировании 40/20.',catalogNotes:['All Star — глобальная программа. Сообщи участникам: сегодня те же упражнения выполняются в каждом F45 по всему миру. Это создаёт особый командный дух.','4 пода с противоположными мышечными группами — это осознанный дизайн. Пока один под отдыхает, другой работает. Нет нужды торопиться между подами.','3 круга в поде при 40/20: это объём. Выбирай вес, с которым сможешь поддержать технику ВСЕ 3 круга — не только первый.','На изолирующих упражнениях (бицепс, трицепс, плечи) — никакого читинга. Медленная эксцентрическая фаза (3 сек вниз) при каждом повторении.','45 секунд гидратации между подами — максимально используй их: следующий под, его упражнения, нужный вес. Участники должны быть готовы к старту немедленно.']},

  'Redline':{type:'cardio',typeRu:'Кардио',description:'Redline — кардио-тренировка с пирамидальным таймингом. 9 станций Follow the Leader, пять сетов с нарастающим временем работы: 20→30→40→50→60 секунд — каждый сет жёстче предыдущего.',shortTiming:'20/5→30/5→40/5→50/5→60/20 · 1 круг',timing:[{label:'Тип',value:'Cardio / Cardio Hybrid · Pyramid'},{label:'Сет 1',value:'20с работа / 5с отдых'},{label:'Сет 2',value:'30с работа / 5с отдых'},{label:'Сет 3',value:'40с работа / 5с отдых'},{label:'Сет 4',value:'50с работа / 5с отдых'},{label:'Сет 5',value:'60с работа / 20с отдых'},{label:'Станции',value:'9'},{label:'Круги',value:'1'},{label:'Перемещение',value:'Follow the Leader'}],focus:'Аэробная мощность · Пирамида · Высокий пульс',intensity:'Очень высокая',calories:'600–800',members:'27 (3 на станции)',stations:'9',movement:'Follow the Leader',subtype:'Pyramid',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#1a0a1a',logoText:'REDLINE',catalogDesc:'Redline — кардио/гибридная тренировка, построенная на пирамидальной структуре сетов с нарастающим временем работы и минимальным отдыхом. Участники проходят 9 станций Follow the Leader, каждый раз преодолевая новый порог интенсивности.',catalogNotes:['Пирамида из 5 сетов: 20→30→40→50→60 сек. 5 секунд отдыха до 4-го сета — этого почти не достаточно. Предупреди участников: вода на станции, не ждать перерывов.','Follow the Leader: все движутся ВМЕСТЕ по сигналу. Медлительные задерживают всю волну — акцентируй переход заранее.','Сет 1 (20с) — лёгкий разгон. К сету 4 (50/5) пульс должен быть в красной зоне. Если нет — интенсивность слишком низкая.','На erg-станциях (если есть): максимальный выход — Redline это именно тот момент, когда метры/калории считаются.','После сета 5 (60/20): эти 20 секунд — единственный реальный отдых. Участники должны восстановить дыхание, не растягиваться.']},
  'Triple Threat':{type:'cardio',typeRu:'Кардио',description:'Triple Threat — кардио-тренировка на основе повторений с прогрессирующими сетами: считаешь повторы в Сете 1, удваиваешь в Сете 2, утраиваешь в Сете 3. Это твоя цель — достичь тройной угрозы.',shortTiming:'Сет1: 20/10 · Сет2: 40/20 · Сет3: 60/30 · Racetrack',timing:[{label:'Тип',value:'Cardio / Cardio Hybrid · Rep-based'},{label:'Сет 1',value:'20с работа / 10с отдых'},{label:'Сет 2',value:'40с работа / 20с отдых'},{label:'Сет 3',value:'60с работа / 30с отдых'},{label:'Станции',value:'12'},{label:'Круги',value:'1'},{label:'Перемещение',value:'Racetrack'}],focus:'Аэробная выносливость · Rep-based · Нарастающий объём',intensity:'Высокая',calories:'550–750',members:'36 (3 на станции)',stations:'12',movement:'Racetrack',subtype:'Rep-based',floorPlanType:'racetrack',podCount:1,bgColor:'#1a0a0a',logoText:'TRIPLE THREAT',catalogDesc:'Triple Threat — кардио-гибридная тренировка на основе повторений с простым и жёстким правилом: считаешь повторы в первом сете, удваиваешь во втором, утраиваешь в третьем. 12 станций по racetrack с нарастающим временем работы.',catalogNotes:['Rep-based = участники считают повторения в сете 1. Объясни это ДО старта: «Запомни число — тебе нужно удвоить его в сете 2 и утроить в сете 3».','Выбор движений важен: на сете 1 (20с) нереалистично ожидать 20 повторений burpee. Адаптируй скорость к упражнению.','Сет 3 (60/30): 60 секунд — долго. К середине участники замедляются. Коучинг-кью: «Ты на половине пути — держи темп!»','Racetrack: следи за направлением движения. На переходе 12→1 есть риск столкновения — укажи маршрут визуально.','30 секунд отдыха после сета 3 — достаточно для перемещения, но не для восстановления. Это осознанный выбор дизайна.']},
  'Pinnacle':{type:'resistance',typeRu:'Силовая',description:'Pinnacle — силовая тренировка Peak-фазы. Каждый участник сам выбирает направление: верх или низ тела. Станция 2 — работа на максимальный вес с чередованием отдыха. На остальных станциях: силовое упражнение + кор или мобильность — и так 4 раза подряд перед переходом.',shortTiming:'CS1–4: 35с/20с · 5 станций · 4 комбо-сета · Racetrack',timing:[{label:'Тип',value:'Resistance · Peak Performance'},{label:'Работа / Отдых',value:'35с / 20с'},{label:'Комбо-сетов на станцию',value:'4'},{label:'Станций',value:'10 (5 комбо-пар)'},{label:'Под',value:'1'},{label:'Перемещение',value:'Racetrack'},{label:'Ст. 1, 3, 4, 5',value:'Силовое + Кор/Мобильность = 1 комбо-сет'},{label:'Ст. 2',value:'Максимальный вес · чередование с отдыхом'},{label:'На выбор',value:'Верх тела ИЛИ низ тела'}],focus:'Пиковая сила · Peak Phase · Верх/Низ выбор',intensity:'Высокая',calories:'400–540',members:'30',stations:'10 (5 комбо)',movement:'Racetrack',subtype:'Peak Performance',floorPlanType:'racetrack',podCount:1,bgColor:'#4a6741',logoText:'PINNACLE',catalogDesc:'Pinnacle — силовая тренировка специально для Peak-фазы, где каждый работает в своём направлении: верх или низ тела. Центральная станция 2 — упражнение на максимальный вес, которое чередуется с отдыхом внутри комбо-сета. На станциях 1, 3, 4, 5 каждый комбо-сет состоит из силового движения и упражнения на кор или мобильность. Всего 4 комбо-сета на каждой станции, затем переход к следующей.',catalogNotes:['Перед стартом объясни выбор: «Сегодня каждый решает — работаем только на верх или только на низ тела. Определись сейчас и держись этого весь класс».','Станция 2 — работа на максимальный вес. Участники чередуются между основным упражнением и коротким отдыхом на соседнем месте, выполняя 4 подхода суммарно.','На остальных станциях комбо-сет выглядит так: сначала силовое упражнение (35с), сразу за ним — кор или мобильность (35с), затем 20с отдыха. Это один комбо-сет из четырёх.','Помогай участникам с выбором веса до начала — особенно на станции 2. Если вес слишком лёгкий в первом подходе, к четвёртому уже не будет ощущения работы.']},
  'Down Under':{type:'hybrid',typeRu:'Гибрид',description:'Down Under — новая гибридная пятничная тренировка F45. 10 станций Racetrack, на каждой выбор: кардио (A) или силовое (B). Станции 5 и 10 — длинный сет 3:40 мин для максимальной перегрузки. Прогрессируй от сета к сету.',shortTiming:'Ст.5&10: 220с/20с · 1 сет · Остальные: 40/20 · 4 сета',timing:[{label:'Тип',value:'Hybrid · Member Choice'},{label:'Станции 5 и 10',value:'3 мин 40 сек (220с) / 20с отдых / 1 сет'},{label:'Все остальные станции',value:'40с работа / 20с отдых / 4 сета'},{label:'Станции',value:'10'},{label:'Под',value:'1'},{label:'Круги',value:'1'},{label:'Перемещение',value:'Racetrack'},{label:'A = Кардио',value:'B = Силовое — выбор на каждой станции'}],focus:'Гибрид · Member Choice · Кардио ИЛИ Сила',intensity:'Высокая',calories:'480–650',members:'30 (3 на станции)',stations:'10',movement:'Racetrack',subtype:'Member Choice',floorPlanType:'racetrack',podCount:1,bgColor:'#004400',logoText:'DOWN UNDER',catalogDesc:'Down Under — гибридная тренировка из 10 станций в формате Racetrack. На каждой станции участник выбирает между кардио (A) и силовым (B) упражнением в зависимости от цели тренировки. Станции 5 и 10 — особые: длинный рабочий сет 3 мин 40 сек для максимальной нагрузки и прогрессии. Цель — улучшать результат от сета к сету перед переходом.',catalogNotes:['Объясни систему A/B ДО старта: A = кардио (conditioning), B = силовое (resistance). Участник выбирает ПЕРЕД каждой станцией — не в середине.','Станции 5 и 10 — 3 минуты 40 секунд (1 длинный сет). Объяви это заранее: «Когда дойдёте до звёздочки — будет один длинный сет вместо четырёх коротких».','На станциях 5 и 10 (длинный сет): рекомендуй умеренный вес — это не спринт, а устойчивое усилие на 3:40. Техника важнее скорости.','Прогрессия внутри 4 сетов на обычных станциях: сет 1 — установка веса/темпа, сеты 2-3 — рабочие, сет 4 — максимальный выход.','Down Under — пятничная тренировка. Настрой атмосферу: «Финиш рабочей недели — выбирай что тебе нужно сегодня: сжечь или накачать».']},
  'Spartan':{type:'hybrid',typeRu:'Гибрид',description:'Spartan — командная гибридная тренировка вдохновлённая Spartan Race и Deka. Два силовых пода и центральный эрг-под в формате реле. Unleash your inner warrior!',shortTiming:'Поды 1&3: 40/15 · 1 сет · 3 круга · Erg Pod: 5 мин реле',timing:[{label:'Тип',value:'Hybrid · Team Based'},{label:'Поды 1 и 3',value:'40с работа / 15с отдых · 1 сет · 3 круга'},{label:'Под 2 (ERG)',value:'5 минут реле на каждой станции'},{label:'Станции',value:'15 (5+5+5)'},{label:'Поды',value:'3'},{label:'Перемещение',value:'Поды (3)'}],focus:'Команда · Сила + Эрги · Spartan/Deka стиль',intensity:'Очень высокая',calories:'600–800',members:'36 (2 на станции)',stations:'15',movement:'Поды (3)',subtype:'Team Based',floorPlanType:'pods',podCount:3,bgColor:'#1a0000',logoText:'SPARTAN',catalogDesc:'Spartan — командная гибридная тренировка вдохновлённая Spartan Race и Deka competitions. Два силовых пода обрамляют центральный эрг-под с командным реле. Цель — максимальные метры/калории командой.',catalogNotes:['Erg Pod (Под 2): командное реле на эрг-машинах. Объясни формат ДО старта: один работает максимально, остальные восстанавливаются рядом, ротация каждые ~1-2 мин.','Цель командного пода — суммарные метры/калории. Поощряй командные крики и поддержку — это создаёт атмосферу Spartan.','Поды 1 и 3 (40/15 × 3 круга): 15 секунд — очень короткий отдых. Акцентируй «взрывной старт» каждые 40 секунд.','Убедись что эрг-машины откалиброваны и дамперы настроены до класса. Techincal issues на erg pod убивают momentum всей тренировки.','Участники начинают в разных подах одновременно. Прочертай маршрут переходов на полу/доске.']},
  'Pegasus':{type:'resistance',typeRu:'Силовая',description:'Pegasus — силовая суперсет-тренировка. На каждой станции: силовое упражнение + bodyweight-движение без паузы. 12 станций Racetrack, 3 сета 30:20с/15с — максимальная метаболическая перегрузка.',shortTiming:'30:20/15 · 3 сета · 1 круг · Racetrack',timing:[{label:'Тип',value:'Resistance · Super-set'},{label:'Работа (силовое)',value:'30с'},{label:'Работа (bodyweight)',value:'20с'},{label:'Отдых',value:'15с'},{label:'Сеты',value:'3'},{label:'Круги',value:'1'},{label:'Станции',value:'12'},{label:'Перемещение',value:'Racetrack (1 под)'}],focus:'Силовая выносливость · Суперсет · Метаболическая нагрузка',intensity:'Высокая',calories:'400–550',members:'36 (3 на станции)',stations:'12',movement:'Racetrack',subtype:'Super-set',floorPlanType:'racetrack',podCount:1,bgColor:'#cc4400',logoText:'PEGASUS',catalogDesc:'Pegasus — силовая суперсет-тренировка с уникальным форматом: каждая станция содержит силовое упражнение (30с) немедленно за bodyweight-движением (20с) без паузы между ними. 3 сета на каждой из 12 станций по racetrack.',catalogNotes:['Суперсет: силовое (30с) → bodyweight (20с) → отдых 15с. Между силовым и BW-упражнением НЕТ паузы. Показывай демо и чётко объясняй «никакого отдыха до сигнала».','Выбор веса для силовой части: достаточно тяжёлый для первых 2 сетов, выполнимый для 3-го. Pegasus — не место для рекордов, это объём.','BW-упражнение идёт с уже уставшими мышцами. Это осознанный дизайн — следи за техникой, особенно на приседаниях и отжиманиях в 3-м сете.','Racetrack: переход быстрый — 15 секунд на движение к следующей станции. Оборудование должно быть расставлено до старта.','Pegasus — воскресная тренировка. Объясни финальный настрой фазы: «Это завершение Серии 3 Peak. Вы здесь финишируете сильными».']},

  // === Series 4 Phase 10 (Base) — Reddit r/f45 "Next phase 10" Aug 20 2026 ===
  'Abacus':{type:'cardio',typeRu:'Кардио',description:'Abacus — командная кардио-тренировка с пирамидальными сетами. 6 человек на станцию, short & sharp интервалы. Акцент на взрывное кардио и функциональные упражнения с собственным весом.',shortTiming:'20/10→30/15→40/20 · Follow the Leader',timing:[{label:'Тип',value:'Cardio/Hybrid · Pyramid · Team'},{label:'Сет 1',value:'20с работа / 10с отдых'},{label:'Сет 2',value:'30с работа / 15с отдых'},{label:'Сет 3',value:'40с работа / 20с отдых'},{label:'Станции',value:'6'},{label:'Участники',value:'36 (6 на станцию)'},{label:'Перемещение',value:'Follow the Leader'}],focus:'Командное кардио · Пирамида · Функциональная сила',intensity:'Высокая',calories:'550–750',members:'36 (6 на станции)',stations:'6',movement:'Follow the Leader',subtype:'Pyramid',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#cccc00',logoText:'ABACUS',catalogDesc:'Abacus — командная тренировка в стиле team training с короткими острыми пирамидальными сетами. Акцент на взрывном кардио и функциональной нагрузке с собственным весом для всех уровней подготовки.',catalogNotes:['6 человек на станцию — командная расстановка. До начала объясни кто стартует первым, чтобы не было толкучки.','Пирамида сетов нарастает: 20с→30с→40с. Объяви заранее: «Каждый следующий сет длиннее и тяжелее».','На Follow the Leader: все двигаются ОДНОВРЕМЕННО по сигналу. Опоздавшие сбивают ритм всей группы — подчеркни важность перехода.','Abacus проверяет командный дух: если кто-то устал, остальные поддерживают. Поощряй возгласы и поддержку внутри группы.']},
  'Quarterbacks':{type:'hybrid',typeRu:'Гибрид',description:'Quarterbacks — гибридная тренировка вдохновлённая американским футболом. Нападение и защита: два пода с упражнениями на силу, ловкость и кардио. 55 секунд работы — атакуй каждый сет.',shortTiming:'55с/20с · 2 сета · 1 круг · Поды (2)',timing:[{label:'Тип',value:'Hybrid · Football Inspired'},{label:'Работа',value:'55с'},{label:'Отдых',value:'20с'},{label:'Сеты',value:'2'},{label:'Круги',value:'1'},{label:'Станции',value:'14 (7 в каждом поде)'},{label:'Перемещение',value:'Поды (2)'}],focus:'Ловкость + Сила + Кардио · Командный дух',intensity:'Высокая',calories:'500–680',members:'28 (2 на станции)',stations:'14',movement:'Поды (2)',subtype:'Football Inspired',floorPlanType:'pods',podCount:2,bgColor:'#ccaa00',logoText:'QUARTERBACKS',catalogDesc:'Quarterbacks — гибридная тренировка с элементами американского футбола: нападение и защита в двух симметричных подах. Силовые, ловкостные и кардио-упражнения перемежаются для максимального функционального развития.',catalogNotes:['Два пода располагаются симметрично — как две команды на поле. Участники видят «соперников» напротив, это добавляет мотивацию.','55 секунд — длинный рабочий интервал. Первые 30с — контроль и техника, последние 25с — максимальное усилие.','2 сета на каждой станции: сет 1 — умеренный вес/темп. Сет 2 — прогрессируй. Не трать первый сет на «разведку».','Halftime (гидратация между подами): если в формате есть 60-секундный перерыв — используй его для демонстрации 2-3 упражнений следующего пода.']},
  'Lonestar':{type:'resistance',typeRu:'Силовая',description:'Lonestar — силовая тренировка с упором на одностороннюю нагрузку. Racetrack с разворотом: первый круг в одну сторону, второй — в обратную. Это обеспечивает равномерную нагрузку на обе стороны тела.',shortTiming:'Сет 1: 30/10 · Сет 2: 30/20 · 2 круга · Racetrack',timing:[{label:'Тип',value:'Resistance · Unilateral'},{label:'Сет 1',value:'30с работа / 10с отдых'},{label:'Сет 2',value:'30с работа / 20с отдых'},{label:'Круги',value:'2 (с разворотом в обратную сторону)'},{label:'Станции',value:'12'},{label:'Перемещение',value:'Racetrack'}],focus:'Односторонняя нагрузка · Баланс · Равномерная сила',intensity:'Средне-высокая',calories:'380–520',members:'36 (3 на станции)',stations:'12',movement:'Racetrack',subtype:'Unilateral',floorPlanType:'racetrack',podCount:1,bgColor:'#660066',logoText:'LONESTAR',catalogDesc:'Lonestar — силовая тренировка на основе односторонних движений, обеспечивающая равную нагрузку на обе стороны тела. Racetrack с уникальным разворотом: после первого круга участники меняют направление — благодаря этому рабочая сторона тела чередуется.',catalogNotes:['Разворот направления между кругами — ключевой элемент Lonestar. Объясни до старта: «После первого круга разворачиваемся и идём в обратном направлении — рабочая нога/рука меняется».','Для односторонних движений: в сете 1 работает одна сторона, в сете 2 — другая, ИЛИ оба сета с одной стороной (потом разворот). Уточни логику до начала.','30 секунд на сторону — выбирай вес, с которым выполнишь 8-10 качественных повторений. Не гонись за скоростью.','Сет 2 (30/20) — чуть больше отдыха, чуть тяжелее вес. Напомни об этом после первого круга: «Добавьте вес, если первый сет дался легко».']},
  // === Series 3 Phase 7 (Base) — Intel Week 06/22–06/28, Reddit r/f45, 2026 ===
  'Pipeline':{type:'cardio',typeRu:'Кардио',description:'Pipeline — кардио-тренировка с сёрф-вдохновением: баланс, боковые движения, активация кора и кардиовыносливость. Участники движутся цепочкой через 9 станций без остановок — волна не останавливается.',shortTiming:'40с/20с · 1 сет · 4 круга',timing:[{label:'Тип',value:'Cardio / Cardio Hybrid · Surf-Inspired'},{label:'Работа',value:'40с'},{label:'Отдых',value:'20с'},{label:'Сеты',value:'1'},{label:'Круги',value:'4'},{label:'Станции',value:'9'},{label:'Перемещение',value:'Follow the Leader'},{label:'Примечание',value:'Без гидратационных перерывов'}],focus:'Аэробная выносливость · Баланс · Боковое движение',intensity:'Высокая',calories:'700–850',members:'27 (3 на станции)',stations:'9',movement:'Follow the Leader',subtype:'Surf-Inspired',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#0088cc',logoText:'PIPELINE',catalogDesc:'Pipeline — это кардио-тренировка с сёрф-вдохновением, направленная на развитие баланса, бокового движения, активации кора и кардиовыносливости. Зал выстраивается в одну волну: участники движутся по цепочке через все 9 станций и после 9-й сразу возвращаются на 1-ю — остановок нет.',catalogNotes:['Никаких перерывов — предупреди участников заранее. Пусть возьмут воду на станцию и пьют в 20с отдыха.','Follow the Leader: двигаться сразу, как только прозвучал сигнал. Трейнер убеждается, что все стоят на следующей позиции ДО старта.','На кардио важна не нагрузка, а темп. На battle ropes и ски-эрге — 80% в 1-м круге, максимум в 4-м.','Для shuttle sprints держи корпус низко на разворотах. Касание линии рукой, короткий мощный шаг.','На burpee push-up pyramid считай вслух: 1-2-3-3-2-1 отжиманий. Это держит темп и не даёт срезать.']},
  'Tokyo Disco':{type:'resistance',typeRu:'Силовая',description:'Tokyo Disco — силовая с принципом перегрузки. Два пода: верхний и нижний пояс тела. 3 подхода на каждой станции позволяют прогрессивно повышать вес и накапливать реальный мышечный стресс.',shortTiming:'35с/25с · 3 сета · 1 круг на под',timing:[{label:'Тип',value:'Resistance · Overload'},{label:'Работа',value:'35с'},{label:'Отдых',value:'25с'},{label:'Сеты',value:'3 на каждой станции'},{label:'Круги',value:'1 круг в поде'},{label:'Станции',value:'12 (6 в каждом поде)'},{label:'Перемещение',value:'Поды (2)'},{label:'Гидратация',value:'60с после каждого пода'}],focus:'Гипертрофия · Верх + Низ · Перегрузка',intensity:'Высокая',calories:'400–550',members:'36 (3 на станции)',stations:'12',movement:'Поды (2)',subtype:'Resistance Overload',floorPlanType:'pods',podCount:2,bgColor:'#1a0066',logoText:'TOKYO DISCO',catalogDesc:'Tokyo Disco — силовая тренировка с принципом перегрузки. Под 1 — верхний пояс тела, Под 2 — нижний. 3 подхода на каждой станции при таймировании 35/25 дают возможность работать с тяжёлыми весами и накапливать реальный мышечный стресс.',catalogNotes:['Три подхода — три возможности прогрессировать. Сет 1: умеренно, Сет 2: тяжелее, Сет 3: максимум. Не трать первый подход впустую.','На goblet squat с паузой — 2 секунды внизу должны быть честными: колени разведены, таз на уровне коленей или ниже. Считай вслух.','На тяге штанги — лопатки перед руками. Инициируй движение сведением лопаток, затем подтягивай локти к корпусу.','GHR glute bridge hold — изометрия, не кардио. Задержка 2–3 сек в верхней точке, ягодицы сжаты, таз не проваливается.','Под 2 начинается с уже разогретым телом — не трать первый подход на «разведочный» вес.']},
  'Athletica':{type:'cardio',typeRu:'Кардио',description:'Athletica — одна из оригинальных кардио-тренировок F45, закладывающая аэробную базу фазы. Tabata-формат (20/10): 4 подхода на каждой станции при минимальном отдыхе держат пульс в красной зоне. Три пода — агильность, кардиомашины, взрывная плиометрика.',shortTiming:'20с/10с · 4 сета · 2 круга · Tabata',timing:[{label:'Тип',value:'Cardio · Tabata'},{label:'Работа',value:'20с'},{label:'Отдых',value:'10с'},{label:'Сеты',value:'4 на станции'},{label:'Круги',value:'2 в поде'},{label:'Станции',value:'9 (3 в каждом поде)'},{label:'Перемещение',value:'Поды (3)'},{label:'Гидратация',value:'60с после каждого пода'}],focus:'Аэробная мощность · Tabata · Агильность',intensity:'Очень высокая',calories:'600–800',members:'27 (3 на станции)',stations:'9',movement:'Поды (3)',subtype:'Tabata',floorPlanType:'pods',podCount:3,bgColor:'#cc0066',logoText:'ATHLETICA',catalogDesc:'Athletica — одна из оригинальных и культовых тренировок F45, закладывающая аэробную базу фазы. Tabata-вариант (20/10) — максимальная интенсивность на коротких отрезках. Три разнонаправленных пода: агильность, кардиомашины, взрывная плиометрика.',catalogNotes:['20 секунд — это максимальное усилие, не умеренное. Цель: удержать количество повторений в 4-м подходе не ниже, чем в 1-м.','На deadball throws — бросай ниже пояса, лови мягко. Полное разгибание при броске, при ловле — слегка согни колени.','Balance trainer mountain climbers — колени под грудью, не под животом. 10 сек отдыха используй для быстрой коррекции.','Soft box jumps + burpee hands-off — «hands-off» означает руки НАД полом в нижней точке. Предупреди новичков: другие цели, не обычное бёрпи.','Переход между подами — 60 сек. Используй их для демонстрации 1–2 ключевых движений следующего пода.']},
  'Zeus':{type:'resistance',typeRu:'Силовая',description:'Zeus берёт формат Romans на новый уровень: на каждой станции участник сам выбирает верхний или нижний пояс тела и работает с этим выбором до конца. Цель — строить максимальную (raw) силу через функциональные движения со штангой, гирями и гантелями.',shortTiming:'35с/25с · 2 сета · 2 круга',timing:[{label:'Тип',value:'Resistance · Member Choice'},{label:'Работа',value:'35с'},{label:'Отдых',value:'25с'},{label:'Сеты',value:'2'},{label:'Круги',value:'2'},{label:'Станции',value:'9'},{label:'Перемещение',value:'Поды (3)'},{label:'Нагрузка (малые мышцы)',value:'12–15 повт'},{label:'Нагрузка (большие мышцы)',value:'8–12 повт'}],focus:'Максимальная сила · Member Choice · Верх ИЛИ Низ',intensity:'Высокая',calories:'400–550',members:'27 (3 на станции)',stations:'9',movement:'Поды (3)',subtype:'Member Choice',floorPlanType:'pods',podCount:3,bgColor:'#1a1a4a',logoText:'ZEUS',catalogDesc:'Zeus — это силовая тренировка с Member Choice: на каждой станции участник сам решает, тренировать верхний или нижний пояс, и следует выбранному варианту до конца. Формат взят из Romans, но усложнён свободой выбора. Фокус — строить максимальную (raw) силу.',catalogNotes:['Выбери и придерживайся. Участник выбирает Upper или Lower на всю тренировку — не смешивает. Это обеспечивает объём и прогрессивную усталость целевой группы.','На barbell RDL с паузой — 2 секунды в нижней точке. Штанга не касается пола, hamstrings натянуты — именно пауза создаёт максимальный стимул.','Push press — не жим с читингом. Небольшой подсед, затем полное разгибание коленей и бёдер. Штанга идёт вертикально вверх, не вперёд.','На goblet split squat с паузой — колено точно над средним пальцем стопы. Пауза внизу 2 секунды без отдачи. Блин под переднюю пятку для ограниченной мобильности.','Spiderman push-up on slides — одно движение, две задачи. При опускании нога скользит вперёд (hip flexor stretch), при подъёме возвращается. Синхронность обязательна.']},
  'Miami Nights':{type:'hybrid',typeRu:'Гибрид',description:'Miami Nights — культовая пятничная гибридная тренировка F45. Три пода с чётким разделением: кардио, сила, собственный вес. Тайминг 40/20 при 3 кругах в каждом поде делает тренировку интенсивной и технически контролируемой.',shortTiming:'40с/20с · 1 сет · 3 круга на под',timing:[{label:'Тип',value:'Hybrid'},{label:'Работа',value:'40с'},{label:'Отдых',value:'20с'},{label:'Сеты',value:'1'},{label:'Круги в поде',value:'3'},{label:'Станции',value:'12 (4 в каждом поде)'},{label:'Перемещение',value:'Поды (3)'},{label:'Поды',value:'Под 1: кардио / Под 2: сила / Под 3: собственный вес'},{label:'Гидратация',value:'60с после каждого пода'}],focus:'Кардио + Сила + Bodyweight · Пятница',intensity:'Высокая',calories:'550–700',members:'36 (3 на станции)',stations:'12',movement:'Поды (3)',subtype:'Hybrid',floorPlanType:'pods',podCount:3,bgColor:'#660033',logoText:'MIAMI NIGHTS',catalogDesc:'Miami Nights — культовая пятничная гибридная тренировка F45. Три пода с чётким разделением по фокусу — кардио, сила, собственный вес — обеспечивают полноценную нагрузку на все системы организма без доминирования одного стиля.',catalogNotes:['Начинай с кардио-пода для правильного разогрева. Участники, начавшие с bodyweight, к силовому уже устают в неправильном порядке.','Dumbbell double hang snatch — взрыв из бёдер, не рук. На 40 секундах темп умеренный — приоритет технике над скоростью.','Barbell sumo squat — носки 45°, колени отслеживают носки на протяжении всего движения. Напоминай 3 раза за 3 круга.','Yogy push-up — это волна, не просто отжимание: грудь → голова вперёд-вниз → таз в pike → возврат. Медленный эксцентрик 2–3 сек.','Fast feet sprawl — «быстрые ноги» должны быть БЫСТРЫМИ: 8–10 шагов перед sprawl. Sprawl — не бёрпи, грудь касается пола без прыжка.']},
  'Riddler':{type:'hybrid',typeRu:'Гибрид',description:'Riddler — 60-минутная гибридная суббота: 6 подов, чередующих кардио и силовую нагрузку. Два круга с разным таймингом: Круг 1 (60/20) — темп и техника, Круг 2 (30/10+30/15) — максимальное жиросжигание. Каждый под завершается упражнением на кор.',shortTiming:'К1: 60с/20с · К2: 30с/10с+30с/15с · 60 мин',timing:[{label:'Тип',value:'Hybrid · 60 минут'},{label:'Круг 1',value:'60с работа / 20с отдых · 1 сет'},{label:'Круг 2, Сет 1',value:'30с работа / 10с отдых'},{label:'Круг 2, Сет 2',value:'30с работа / 15с отдых'},{label:'Станции',value:'18 (3 в каждом поде)'},{label:'Поды',value:'6 (нечётные=кардио, чётные=сила)'},{label:'Перемещение',value:'Поды (6)'}],focus:'Кардио + Сила + Кор · 60 мин · Суббота',intensity:'Очень высокая',calories:'600–850',members:'36 (2 на станции)',stations:'18',movement:'Поды (6)',subtype:'60-minutes',floorPlanType:'pods',podCount:6,bgColor:'#1a1a2e',logoText:'RIDDLER',catalogDesc:'Riddler — 60-минутная субботняя гибридная тренировка с уникальной двухкруговой структурой. Первый круг (60/20) — установка темпа, второй (30/10+30/15) — максимальное жиросжигание. Шесть подов чередуют кардио и силовую нагрузку, каждый под завершается упражнением на кор.',catalogNotes:['Круг 1 — стратегический, не предельный. 60 секунд: задача — темп и техника. Экономь усилия, Круг 2 (30/10) потребует максимума.','На 4-second bicycle crunch hold — отсчитывай вслух «один-два-три-четыре». Это убирает соблазн срезать удержание.','Devils press с одной гантелью — попеременная смена рук обязательна. Следи за полным разгибанием в верхней точке (рука над головой).','Lateral shoot-throughs — таз низко при простреле. Бёдра уходят в сторону и ЧЕРЕЗ, а не СВЕРХУ. Покажи демо на перерыве между кругами.','60-минутная тренировка: потрать 90 сек на ориентацию перед стартом. Раздели участников на нечётные (кардио) и чётные (сила) стороны.']},
  'Piston':{type:'resistance',typeRu:'Силовая',description:'The Piston — воскресная силовая тренировка в формате racetrack. Строгое чередование верхнего и нижнего пояса тела на 12 станциях. Три круга с нарастающим таймингом (35/25 → 35/25 → 40/20) обеспечивают прогрессивную перегрузку.',shortTiming:'К1-2: 35с/25с · К3: 40с/20с · Racetrack',timing:[{label:'Тип',value:'Resistance'},{label:'Круг 1',value:'35с работа / 25с отдых · 1 сет'},{label:'Круг 2',value:'35с работа / 25с отдых · 1 сет'},{label:'Круг 3',value:'40с работа / 20с отдых · 1 сет'},{label:'Станции',value:'12'},{label:'Перемещение',value:'Racetrack'},{label:'Гидратация',value:'45с после каждого круга'}],focus:'Функциональная сила · Верх + Низ · Racetrack',intensity:'Высокая',calories:'400–530',members:'36 (3 на станции)',stations:'12',movement:'Racetrack',subtype:'Resistance',floorPlanType:'racetrack',podCount:1,bgColor:'#cc3300',logoText:'PISTON',catalogDesc:'The Piston — воскресная силовая тренировка, построенная как поршневой механизм: строгое чередование верхнего и нижнего пояса тела по всем 12 станциям в формате racetrack. Три круга с нарастающим таймингом обеспечивают прогрессивную перегрузку.',catalogNotes:['Третий круг — другая игра: смена тайминга с 35/25 на 40/20. Объяви это во время второго перерыва: «Следующий круг — 40с работы, 20с отдыха. Выбирайте вес соответственно.»','Revo back squat pulses — штанга в позиции, диапазон 5–10 см в нижней трети приседа. Не превращай пульсы в полноценные приседания.','Barbell bicep partials ×3 — это три ЧАСТИЧНЫХ повтора за один «счёт». Нижняя треть амплитуды. Показывай на демо, участники путаются.','На swiss ball leg curls — таз к потолку на протяжении всего упражнения. Типичная ошибка — опускание таза при сгибании ног.','Neutral grip разгружает запястья и плечи — подчеркни это для участников с дискомфортом в суставах. Ладони друг к другу.']},
   // === Series 2 Phase 5 workouts from 2025 Catalogue ===
  'Red Diamond':{type:'resistance',typeRu:'Силовая',description:'Уникальная смесь двух самых успешных силовых тренировок F45. Четыре сета с убывающим временем работы и возрастающим отдыхом — максимальная мышечная перегрузка в каждом поде.',shortTiming:'45/15 → 40/20 → 35/25 → 30/30 · 1 круг',timing:[{label:'Сет 1',value:'45с работа / 15с отдых'},{label:'Сет 2',value:'40с работа / 20с отдых'},{label:'Сет 3',value:'35с работа / 25с отдых'},{label:'Сет 4',value:'30с работа / 30с отдых'},{label:'Круги',value:'1'},{label:'Перемещение',value:'Поды (3)'}],focus:'Всё тело · Мышечная перегрузка',intensity:'Высокая',calories:'400–550',members:'27 (3 на станции)',stations:'9',movement:'Поды (3)',subtype:'Muscular Overload',floorPlanType:'pods',podCount:3,bgColor:'#8B0000',logoText:'RED DIAMOND',catalogDesc:'Red Diamond — уникальная смесь двух наиболее успешных силовых тренировок F45. Жёсткая система таймингов из 4 сетов проработает мышцы до полного отказа в этой полнотелесной силовой сессии.',catalogNotes:['По мере уменьшения времени работы — увеличивается время отдыха, давая возможность скорректировать вес.','Серия сетов на каждой станции позволяет участникам максимизировать повторения и добиться мышечного утомления перед переходом.','60-секундный перерыв на гидратацию после завершения каждого пода.']},
  'Hammer':{type:'resistance',typeRu:'Силовая',description:'Силовая сплит-тренировка — вы сами выбираете путь. На каждой станции упражнение на верх или низ тела: stimulus-специфичная работа, затем полноамплитудное движение. Максимальный рост мышц.',shortTiming:'30с+15с / 15с → 2 сета · 2 круга',timing:[{label:'Круг 1, Сет 1',value:'30с работа / 15с отдых'},{label:'Круг 1, Сет 2',value:'30с работа / 20с отдых'},{label:'Круг 2, Сет 1',value:'30с работа / 15с отдых'},{label:'Круг 2, Сет 2',value:'30с работа / 20с отдых'},{label:'Перемещение',value:'Follow the Leader'}],focus:'Верх или Низ · Сплит',intensity:'Средне-высокая',calories:'350–500',members:'27 (3 на станции)',stations:'9',movement:'Follow the Leader',subtype:'Split Resistance — Choose your journey',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#d4c800',logoText:'HAMMER',catalogDesc:'Hammer — сплит-силовая тренировка, где вы сами управляете нагрузкой. На каждой станции два варианта: верх или низ тела. Каждый сет состоит из stimulus-специфичного упражнения с непосредственным переходом к полноамплитудному движению.',catalogNotes:['На каждой станции выбор: упражнение на верх ИЛИ низ тела.','Каждый сет: 30с stimulus-упражнение сразу за 15с полноамплитудного движения — без отдыха между ними.','Между этими двумя упражнениями прозвучит звуковой сигнал — важно предупредить участников заранее.']},
  'Apex':{type:'hybrid',typeRu:'Гибрид',description:'Гибридная суперсет-тренировка на основе повторений. Пирамида 12→10→8→6→8→10→12: поднимайтесь к вершине и спускайтесь обратно. Увеличивайте вес на подъёме, снижайте на спуске.',shortTiming:'4 мин / 45с гидратация · Racetrack',timing:[{label:'Формат',value:'Rep-based пирамида'},{label:'Пирамида',value:'12→10→8→6→8→10→12 повт.'},{label:'Время на станцию',value:'4 минуты'},{label:'Переход',value:'45с гидратация'},{label:'Перемещение',value:'Racetrack'}],focus:'Всё тело · Пиковая сила',intensity:'Высокая',calories:'450–600',members:'32',stations:'8 (2 комбо на станции)',movement:'Racetrack',subtype:'Reb-base Super-set',floorPlanType:'racetrack',podCount:1,bgColor:'#1a1500',logoText:'APEX',catalogDesc:'Apex — гибридная суперсет-тренировка на основе повторений с пирамидальной структурой. Участники работают в своём темпе, поднимаясь к пику и спускаясь обратно: 12, 10, 8, 6, 8, 10, 12 повторений.',catalogNotes:['Суперсет A+B: оба упражнения подряд = 1 раунд пирамиды.','Увеличивайте вес при подъёме к пику (6 повт.), уменьшайте при спуске.','При завершении пирамиды за отведённое время — продолжайте с 12 повторений.','Можно отдыхать внутри сета по необходимости.','45 секунд гидратации для перехода между станциями.']},
  'SoCal':{type:'hybrid',typeRu:'Гибрид',description:'60-минутная гибридная суббота! Кардио, сила, ловкость, мощность и кор. Убывающие интервалы по кругам плюс 4 раунда командного bodyweight-финишера в конце каждого пода.',shortTiming:'60/30 → 40/20 → 20/10 + финишер · 60 мин',timing:[{label:'Круг 1',value:'60с работа / 30с отдых'},{label:'Круг 2',value:'40с работа / 20с отдых'},{label:'Круг 3',value:'20с работа / 10с отдых'},{label:'Финишер',value:'4 раунда: 30/10 (круг 1), 20/10 (круги 2-4)'},{label:'Поды',value:'2'},{label:'Длительность',value:'60 минут'}],focus:'Кардио + Сила + Кор · 60 мин',intensity:'Очень высокая',calories:'600–850',members:'36 (3 на станции)',stations:'12',movement:'Поды (2)',subtype:'60-minutes',floorPlanType:'pods',podCount:2,bgColor:'#c2185b',logoText:'SOCAL',catalogDesc:'SoCal — 60-минутная гибридная тренировка для субботы: кардио, сила, ловкость, мощность и кор. Убывающие интервалы нарастают по интенсивности, а командный bodyweight-финишер в конце каждого пода создаёт особую атмосферу.',catalogNotes:['Убывающие интервалы по кругам: 60/30 → 40/20 → 20/10 — интенсивность нарастает.','В конце каждого пода: 4 раунда командных bodyweight-упражнений по реелу на экранах.','Командный финишер — все тренируются вместе, следуя рилу. Создайте энергию в зале!','Ознакомьтесь с reel-упражнениями заранее в разделе Timeline приложения F45tv.']},
  // === Series 2 Phase 5 (Build) ===
  'Seoul Rush':{type:'hybrid',typeRu:'Гибрид',description:'Вдохновлена городом, который никогда не замедляется. Гибридная кардио-сессия с постоянно меняющимися станциями — движение без остановок.',shortTiming:'45с/15с · 2 сета · 2 круга',timing:[{label:'Работа / Отдых',value:'45 сек / 15 сек'},{label:'Сеты',value:'2'},{label:'Круги',value:'2'},{label:'Перемещение',value:'Follow the Leader'}],focus:'Кардио + Сила · Динамика',intensity:'Высокая',calories:'500–700',members:'27 (1 на станции)',stations:'27',movement:'Follow the Leader',subtype:'Hybrid',floorPlanType:'follow_the_leader',podCount:1,bgColor:'#e8001a',logoText:'SEOUL RUSH',catalogNotes:['Вдохновлена Сеулом — городом, который никогда не замедляется.','Эволюционирующие станции держат вас в постоянном движении.']},

  'Liberty':{type:'resistance',typeRu:'Силовая',description:'Первая F45 тренировка с time under tension — весь зал работает синхронно в заданном темпе. Фокус на технике и качестве движений.',shortTiming:'TUT · темп зала · 3 пода',timing:[{label:'Формат',value:'Time under tension'},{label:'Перемещение',value:'Поды (3)'},{label:'Особенность',value:'Весь зал в одном темпе'}],focus:'Всё тело · Мышечная перегрузка',intensity:'Средне-высокая',calories:'350–500',members:'27 (3 на станции)',stations:'18 (3 комбо-станции в поде)',movement:'Поды (3)',subtype:'Time under tension',floorPlanType:'pods',podCount:3,bgColor:'#003087',logoText:'LIBERTY',catalogNotes:['Весь зал работает синхронно — первая TUT-тренировка F45.','Фокус на форме и идеальной технике при контролируемом темпе.']},
  // === Series 1 Phase 1 (Base) ===

const DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DAYS_RU_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const PHASE_TYPES = {Base:'🏗️',Build:'⚡',Peak:'🔥'};

// ===== STATE =====
let currentPhaseId = 9;
let currentWeek = 0;
let currentFilter = 'all';

// ===== HELPERS =====
function parseDate(s) { const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function formatDate(d) { return `${d.getDate()} ${MONTHS_RU[d.getMonth()]}`; }
function formatDateShort(d) { return `${d.getDate()} ${MONTHS_RU[d.getMonth()].slice(0,3)}`; }
function isToday(d) { const n=new Date(); return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }
function getPhase(id) { for(const s of SERIES) for(const p of s.phases) if(p.id===id) return p; return null; }
function getSeriesForPhase(id) { for(const s of SERIES) for(const p of s.phases) if(p.id===id) return s; return null; }

function generateDays(phase) {
  if(!phase.schedule) return [];
  const days=[], start=parseDate(phase.start), end=parseDate(phase.end);
  const cur=new Date(start);
  while(cur<=end) {
    const dow=(cur.getDay()+6)%7;
    const wName=phase.schedule[dow];
    const wData=WORKOUTS[wName]||{type:'hybrid',typeRu:'Гибрид',description:'Тренировка '+wName,shortTiming:'45 мин',timing:[],focus:'Всё тело',intensity:'Средняя',calories:'400–600'};
    days.push({date:new Date(cur),workout:wName,...wData});
    cur.setDate(cur.getDate()+1);
  }
  return days;
}

function countTypes(schedule) {
  if(!schedule) return {cardio:0,resistance:0,hybrid:0};
  const c={cardio:0,resistance:0,hybrid:0};
  schedule.forEach(w=>{const d=WORKOUTS[w]; if(d) c[d.type]++;});
  return c;
}

// ===== RENDER =====
function renderSeriesTabs() {
  const currentSeries = getSeriesForPhase(currentPhaseId);
  const el = document.getElementById('seriesTabs');
  el.innerHTML = SERIES.map(s => {
    const active = s.id===currentSeries.id ? ' active' : '';
    return `<button class="series-tab-btn${active}" data-series="${s.id}">${s.nameRu}</button>`;
  }).join('');
  el.querySelectorAll('.series-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = parseInt(btn.dataset.series);
      const s = SERIES.find(x=>x.id===sid);
      if(s) { currentPhaseId=s.phases[0].id; currentWeek=0; currentFilter='all';
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        renderAll(); }
    });
  });
}

function renderSeriesBanner() {
  const series = getSeriesForPhase(currentPhaseId);
  const el = document.getElementById('seriesBanner');
  const sStart = parseDate(series.startDate), sEnd = parseDate(series.endDate);
  el.innerHTML = `
    <div class="series-name">${series.nameRu}</div>
    <div class="series-desc">${series.description}</div>
    <div class="series-meta">
      <div class="series-meta-item">12 недель · 3 фазы: <strong>Base → Build → Peak</strong></div>
      <div class="series-meta-item">${formatDate(sStart)} – ${formatDate(sEnd)}</div>
    </div>`;
}

function renderPhaseTabs() {
  const series = getSeriesForPhase(currentPhaseId);
  const el = document.getElementById('phaseTabs');
  el.innerHTML = series.phases.map(p => {
    const active = p.id===currentPhaseId ? ' active' : '';
    const future = !p.schedule ? ' future' : '';
    return `<button class="phase-tab${active}${future}" data-phase="${p.id}">
      <span class="tab-label">${PHASE_TYPES[p.type]||''} ${p.typeRu}</span>
      <span class="tab-name">${p.nameRu}</span>
    </button>`;
  }).join('');

  el.querySelectorAll('.phase-tab:not(.future)').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPhaseId = parseInt(btn.dataset.phase);
      currentWeek = 0; currentFilter = 'all';
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector('[data-filter="all"]').classList.add('active');
      renderAll();
    });
  });
}

function renderPhaseInfo() {
  const phase = getPhase(currentPhaseId);
  const start = parseDate(phase.start), end = parseDate(phase.end);
  document.getElementById('phaseInfo').innerHTML = `
    <div class="date-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Старт: <strong>${formatDate(start)}</strong></div>
